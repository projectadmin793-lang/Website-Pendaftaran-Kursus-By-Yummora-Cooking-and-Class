let PROOF=null;

function bindDrop(d){const pf=$('#pf');d.onclick=()=>pf.click();d.onkeydown=e=>{if(e.key==='Enter')pf.click()};
 ['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
 d.addEventListener('drop',e=>handleProof(e.dataTransfer.files[0]));pf.onchange=()=>handleProof(pf.files[0])}
async function handleProof(f){const pv=$('#pv'),btn=$('#send');PROOF=null;if(btn)btn.disabled=true;if(!f)return;
 const okT=['image/jpeg','image/png','application/pdf'].includes(f.type);if(!okT){pv.innerHTML='<div class="err">❌ Format tidak didukung. Gunakan JPG, PNG, atau PDF.</div>';return}
 if(f.size>5*1024*1024){pv.innerHTML='<div class="err">❌ Ukuran file melebihi 5 MB.</div>';return}
 pv.innerHTML='<p><span class="spin"></span> Memeriksa file...</p>';const buf=await readFile(f,'buf'),h=await sha(buf);
 const cur=$('[data-act=sendOrder]')?.dataset.reup;if(DB.orders.some(o=>!o.deleted_at&&o.proof?.hash===h&&o.id!==cur)){pv.innerHTML='<div class="err">❌ Bukti transfer ini sudah pernah digunakan pada pesanan lain.</div>';return}
 let data=null;if(f.type.startsWith('image/'))data=await shrinkImage(f);else if(f.size<1200000)data=await readFile(f);
 PROOF={name:f.name,type:f.type,size:f.size,hash:h,data};
 pv.innerHTML=`<div class="prev">${f.type.startsWith('image/')?`<img src="${data}" alt="Preview" data-act="zm">`:'<div style="font-size:2.4rem">📄</div>'}<div><b>${esc(f.name)}</b><br><small>${(f.size/1024).toFixed(0)} KB · siap dikirim ✅</small></div></div>`;
 if(btn)btn.disabled=false}

ACT.sendOrder=t=>{if(!PROOF)return;const reup=t.dataset.reup;

 const u=me(),o=newOrder({...DRAFT,userId:u.id,proof:PROOF});sendEmail(o.email,'Pesanan diterima - '+o.no,`Halo ${o.name}, pesanan ${o.no} untuk "${byId('courses',o.courseId).title}" telah kami terima dan sedang diverifikasi.`);
 sendEmail(S().email,'[Admin] Pesanan baru '+o.no,`${o.name} (${o.email}) memesan ${byId('courses',o.courseId).title} - ${rp(o.total)}`);audit('Pesanan baru',o.no);save();DRAFT=null;go('#/selesai/'+o.id)};

async function alphaFrac(blob){const u=URL.createObjectURL(blob);try{const i=await new Promise((r,j)=>{const m=new Image();m.onload=()=>r(m);m.onerror=j;m.src=u});const c=document.createElement('canvas');c.width=Math.min(i.width,300);c.height=Math.max(1,Math.round(i.height*c.width/i.width));const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;let n=0;for(let k=3;k<d.length;k+=4)if(d[k]<20)n++;return n/(d.length/4)}finally{URL.revokeObjectURL(u)}}
async function stampRemoveBg(file,max=600){const src=await pngBlob(file,max);let out=null;
 try{out=await keyOut(src);if(await alphaFrac(out)<.03)out=null}catch(e){out=null}
 if(!out){try{const m=await withTO(import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm'),30000);out=await withTO(m.removeBackground(src),120000)}catch(e){out=null}}
 if(!out)throw new Error('gagal');return blobURL(out)}

function shrinkPNG(file,max=800){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/png'))};i.onerror=()=>res('');i.src=URL.createObjectURL(file)})}

ACT.lgSlot=t=>{LG.slot=t.dataset.k;LG.orig=LG.res=null;LG.msg='';route()};
const lgUpd=()=>{const e=$('#lgres');if(e)e.innerHTML=lgResult()};
document.addEventListener('routed',()=>{if($('#drop')&&location.hash.startsWith('#/admin/logo')){const d=$('#drop'),pf=$('#pf');d.onclick=()=>pf.click();['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',e=>lgFile(e.dataTransfer.files[0]));pf.onchange=()=>lgFile(pf.files[0]);$('#rbk').oninput=e=>LG.key=e.target.value}});
function lgFile(f){if(!f)return;LG.msg='';if(!['image/jpeg','image/png','image/webp'].includes(f.type)){LG.msg='Format tidak didukung. Gunakan JPG, PNG, atau WebP.';LG.orig=null;lgUpd();return}if(f.size>5*1048576){LG.msg='Ukuran file melebihi 5 MB.';LG.orig=null;lgUpd();return}LG.file=f;lgRun()}
const pngBlob=(f,max=900)=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/png')};i.onerror=()=>rej(new Error('Gambar tidak dapat dibaca'));i.src=URL.createObjectURL(f)});
const blobURL=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)});
const withTO=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('Waktu habis')),ms))]);
async function lgRun(){LG.busy=true;LG.res=null;LG.msg='';LG.method='';lgUpd();let src;
 try{src=await pngBlob(LG.file);LG.orig=await blobURL(src)}catch(e){LG.busy=false;LG.msg='Gagal membaca gambar: '+e.message;LG.orig=null;lgUpd();return}
 let out=null,notes=[];
 try{const m=await withTO(import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm'),30000);out=await withTO(m.removeBackground(src),120000);LG.method='AI di browser'}catch(e){notes.push('AI browser gagal ('+(e.message||e)+')')}
 if(!out&&LG.key){try{const fd=new FormData();fd.append('image_file',src);fd.append('size','auto');const r=await fetch('https://api.remove.bg/v1.0/removebg',{method:'POST',headers:{'X-Api-Key':LG.key},body:fd});if(!r.ok)throw new Error('HTTP '+r.status);out=await r.blob();LG.method='remove.bg'}catch(e){notes.push('remove.bg gagal ('+e.message+')')}}
 if(!out){try{out=await keyOut(src);LG.method='mode cadangan: deteksi warna latar';notes.push('Memakai mode cadangan; paling bagus untuk logo dengan latar polos.')}catch(e){LG.msg='Gagal menghapus background: '+e.message;LG.busy=false;lgUpd();return}}
 LG.res=await blobURL(out);LG.msg=notes.join(' ');LG.busy=false;if(LG.msg)toast(LG.msg);lgUpd()}
function keyOut(blob){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const w=i.width,h=i.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(i,0,0);const im=x.getImageData(0,0,w,h),d=im.data;
 const px=(a,b)=>{const k=(b*w+a)*4;return[d[k],d[k+1],d[k+2],d[k+3]]};const cs=[px(0,0),px(w-1,0),px(0,h-1),px(w-1,h-1)];const bg=[0,1,2].map(j=>cs.reduce((s,p)=>s+p[j],0)/4);
 if(cs.some(p=>p[3]<10)){c.toBlob(res,'image/png');return}const T=48,dist=k=>Math.hypot(d[k]-bg[0],d[k+1]-bg[1],d[k+2]-bg[2]);const seen=new Uint8Array(w*h),q=[];
 const push=(a,b)=>{if(a<0||b<0||a>=w||b>=h)return;const p=b*w+a;if(seen[p])return;if(dist(p*4)<T){seen[p]=1;q.push(p)}};for(let a=0;a<w;a++){push(a,0);push(a,h-1)}for(let b=0;b<h;b++){push(0,b);push(w-1,b)}
 while(q.length){const p=q.pop(),a=p%w,b=(p/w)|0;push(a+1,b);push(a-1,b);push(a,b+1);push(a,b-1)}
 for(let p=0;p<w*h;p++)if(seen[p])d[p*4+3]=0;else{const a=p%w,b=(p/w)|0;if((a&&seen[p-1])||(a<w-1&&seen[p+1])||(b&&seen[p-w])||(b<h-1&&seen[p+w]))d[p*4+3]=Math.min(d[p*4+3],150)}
 x.putImageData(im,0,0);c.toBlob(b=>b?res(b):rej(new Error('Canvas gagal')),'image/png')};i.onerror=()=>rej(new Error('Gambar tidak dapat dibaca'));i.src=URL.createObjectURL(blob)})}

const FIREBASE_CONFIG={apiKey:'AIzaSyCDaq-YPBHuLqR0fAGdIko1b_c3GUCdMkA',authDomain:'yummora-cooking-and-class.firebaseapp.com',projectId:'yummora-cooking-and-class',storageBucket:'yummora-cooking-and-class.firebasestorage.app',messagingSenderId:'1003813970284',appId:'1:1003813970284:web:6eecd69032ca6de694d349'};
const FB={on:false,started:false,pull:false,seed:false,synced:{},seen:{},ready:{},db:null,rt:null};
const FB_ARR=['courses','materials','instructors','features','users','orders','promos','testimonials','faqs','accounts','categories','consults','synclogs','audit','emails'];
const FB_COLS=[...FB_ARR,'progress','settings'];
const FB_SORT=['orders','consults','synclogs','audit','emails'];
const fbHash=x=>{let h=5381;for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return x.length+'.'+(h>>>0).toString(36)};
function fbJson(col,v){if(v===undefined)return null;let j=JSON.stringify(v);if(j===undefined)return null;
 if(j.length>900000&&col==='orders'&&v.proof&&v.proof.data){j=JSON.stringify({...v,proof:{...v.proof,data:null}})}
 if(j.length>900000){if(!FB.warned){FB.warned=1;toast('Ada data terlalu besar (>1 MB) yang tidak bisa disinkronkan ke cloud.','er')}return null}return j}
function fbGet(col,id){if(col==='progress')return DB.progress&&DB.progress[id];if(col==='settings')return DB.settings&&DB.settings[id];return (DB[col]||[]).find(x=>String(x.id)===id)}
const fbLocalJ=(col,id)=>{const v=fbGet(col,id);return v===undefined?null:fbJson(col,v)};
function fbUnits(){const m=new Map();
 FB_ARR.forEach(k=>(DB[k]||[]).forEach(r=>{if(r&&r.id!=null)m.set(k+'/'+r.id,[k,String(r.id),r])}));
 Object.entries(DB.progress||{}).forEach(([id,v])=>m.set('progress/'+id,['progress',id,v]));
 Object.entries(DB.settings||{}).forEach(([id,v])=>{if(v!==undefined)m.set('settings/'+id,['settings',id,v])});
 return m}
function fbApply(col,id,j,removed){
 if(col==='progress'){DB.progress=DB.progress||{};if(removed)delete DB.progress[id];else DB.progress[id]=JSON.parse(j);return}
 if(col==='settings'){if(!removed)DB.settings[id]=JSON.parse(j);return}
 const a=DB[col]=DB[col]||[],i=a.findIndex(x=>String(x.id)===id);
 if(removed){if(i>=0)a.splice(i,1);return}
 const r=JSON.parse(j);if(i>=0)a[i]=r;else a.push(r)}
function fbSaveMap(){try{localStorage.setItem('yummora_fbmap',JSON.stringify(FB.synced))}catch(e){}}
function fbPersistLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function fbRefresh(){clearTimeout(FB.rt);FB.rt=setTimeout(function f(){const a=document.activeElement,h=location.hash||'#/';
 const typing=a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable);
 if(($('#modal')&&$('#modal').children.length)||typing||/^#\/(pesan|bayar|selesai|login|daftar|invoice|resetadmin)/.test(h)){FB.rt=setTimeout(f,2500);return}
 const y=scrollY;route();scrollTo(0,y)},400)}
function fbListen(col){return new Promise(res=>{
 FB.db.collection(col).onSnapshot(snap=>{let ch=false;const first=!FB.ready[col];
  snap.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;
   const id=c.doc.id,key=col+'/'+id;if(first)(FB.seen[col]=FB.seen[col]||{})[id]=1;
   if(c.type==='removed'){if(col==='settings')return;const lj=fbLocalJ(col,id);
    if(lj!==null&&FB.synced[key]!==undefined&&fbHash(lj)!==FB.synced[key])return;
    fbApply(col,id,null,true);delete FB.synced[key];ch=true;return}
   const j=c.doc.data().j;if(typeof j!=='string')return;const h=fbHash(j),lj=fbLocalJ(col,id);
   if(FB.synced[key]!==undefined&&lj!==null&&fbHash(lj)!==FB.synced[key])return;
   if(lj===null||fbHash(lj)!==h){fbApply(col,id,j,false);ch=true}
   FB.synced[key]=h});
  if(first){FB.ready[col]=1;
   if(!FB.pull&&col!=='settings'){const seen=FB.seen[col]||{};Object.keys(FB.synced).forEach(key=>{if(key.startsWith(col+'/')&&!seen[key.slice(col.length+1)]){const id=key.slice(col.length+1),lj=fbLocalJ(col,id);if(lj!==null&&fbHash(lj)===FB.synced[key]){fbApply(col,id,null,true);delete FB.synced[key];ch=true}else if(lj===null)delete FB.synced[key]}})}
   res()}
  if(ch){FB_SORT.forEach(k=>{if(DB[k])DB[k].sort((a,b)=>String(b.created_at||b.at||'').localeCompare(String(a.created_at||a.at||'')))});
   fbPersistLocal();fbSaveMap();if(FB.started){try{applyBranding()}catch(e){}fbRefresh()}}
 },err=>{fbErr(err);res()})})}
function fbErr(e){console.warn('Firestore:',e);if(!FB.errShown){FB.errShown=1;toast(e&&e.code==='permission-denied'?'Sinkron cloud ditolak: periksa Rules Firestore.':'Sinkron cloud bermasalah, data tetap tersimpan di perangkat ini.','er')}}
let fbT=null,fbBusy=false,fbAgain=false;
function fbQueue(){if(!FB.on||!FB.started)return;clearTimeout(fbT);fbT=setTimeout(fbPush,700)}
async function fbPush(){if(fbBusy){fbAgain=true;return}fbBusy=true;
 try{const units=fbUnits(),ops=[];
  units.forEach(([col,id,v],key)=>{const j=fbJson(col,v);if(j===null)return;const h=fbHash(j);if(FB.synced[key]!==h)ops.push({t:'set',key,col,id,j,h})});
  Object.keys(FB.synced).forEach(key=>{if(!units.has(key)&&!key.startsWith('settings/')){const k=key.indexOf('/');ops.push({t:'del',key,col:key.slice(0,k),id:key.slice(k+1)})}});
  for(let i=0;i<ops.length;i+=400){const part=ops.slice(i,i+400),b=FB.db.batch();
   part.forEach(o=>{const r=FB.db.collection(o.col).doc(o.id);o.t==='set'?b.set(r,{j:o.j,u:Date.now()}):b.delete(r)});
   await b.commit();part.forEach(o=>{o.t==='set'?FB.synced[o.key]=o.h:delete FB.synced[o.key]});fbSaveMap()}
  if(FB.seed){await FB.db.collection('meta').doc('init').set({at:Date.now()});FB.seed=false}
 }catch(e){fbErr(e)}
 fbBusy=false;if(fbAgain){fbAgain=false;fbQueue()}}
const blobData=b=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(b)});
async function fbPushImg(id,blob){if(!FB.on)return;let d=await blobData(blob);
 for(const [mx,q] of [[1800,.8],[1400,.75],[1000,.7],[700,.65]]){if(d.length<=900000)break;try{d=await blobData(await shrinkBlob(blob,mx,q))}catch(e){break}}
 if(d.length>900000)return;await FB.db.collection('files').doc(id).set({d,u:Date.now()})}
function fbDelImg(id){if(FB.on)FB.db.collection('files').doc(id).delete().catch(()=>{})}
function fbListenFiles(){return new Promise(res=>{let first=true;const remote={};
 FB.db.collection('files').onSnapshot(async snap=>{let ch=false;
  for(const c of snap.docChanges()){if(c.doc.metadata.hasPendingWrites)continue;const id=c.doc.id;if(first)remote[id]=1;
   if(c.type==='removed')continue;if(IMG[id])continue;const d=c.doc.data().d;if(typeof d!=='string')continue;
   try{const b=await (await fetch(d)).blob();await idbPut(id,b);IMG[id]=URL.createObjectURL(b);ch=true}catch(e){}}
  if(first){first=false;Object.keys(IMG).forEach(id=>{if(!remote[id]){fetch(IMG[id]).then(r=>r.blob()).then(b=>fbPushImg(id,b)).catch(()=>{})}});res()}
  if(ch&&FB.started)fbRefresh()},err=>{fbErr(err);res()})})}
async function fbInit(){const c=FIREBASE_CONFIG;if(!c.apiKey||!c.projectId)return false;
 try{await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  firebase.initializeApp(c);FB.db=firebase.firestore();FB.db.settings({experimentalAutoDetectLongPolling:true});
  let mp=null;try{mp=JSON.parse(localStorage.getItem('yummora_fbmap')||'null')}catch(e){}
  const meta=await FB.db.collection('meta').doc('init').get();FB.on=true;FB.seed=!meta.exists;
  if(meta.exists&&!mp){FB.pull=true;FB.synced={};FB_ARR.forEach(k=>{DB[k]=[]});DB.progress={}}else FB.synced=mp||{};
  await Promise.all([...FB_COLS.map(fbListen),fbListenFiles()]);
  FB.pull=false;FB_SORT.forEach(k=>{if(DB[k])DB[k].sort((a,b)=>String(b.created_at||b.at||'').localeCompare(String(a.created_at||a.at||'')))});
  fbPersistLocal();fbSaveMap();FB.started=true;fbQueue();
  if(isAdmin&&isAdmin())toast('Sinkron cloud aktif ☁️','ok');return true}
 catch(e){FB.on=false;fbErr(e);return false}}
